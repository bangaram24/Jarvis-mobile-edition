<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>J.A.R.V.I.S</h1>
  <p>MOBILE EDITION</p>
</header>

<div class="core">
  <div class="ring ring1"></div>
  <div class="ring ring2"></div>
  <div class="ring ring3"></div>
  <div class="center">
    <div class="core-text">J.A.R.V.I.S</div>
  </div>
</div>

<div class="status">
  <p>AI CORE ONLINE</p>
  <p>NETWORK ONLINE</p>
  <p>VOICE LOCKED</p>
  <p>MEMORY LOCKED</p>
</div>

<div id="chat"></div>

<div class="input-box">
  <input id="msg" placeholder="Ask J.A.R.V.I.S...">
  <button id="send">SEND</button>
  <button id="mic-btn">🎤</button>
  <button id="clear-memory">🧠 CLEAR MEMORY</button>
<button id="camera-btn">📷 CAMERA</button>

<input
  type="file"
  id="image-input"
  accept="image/*"
  capture="environment"
  style="display:none;"
>
</div>

<script src="script.js"></script>

</body>
</html>
